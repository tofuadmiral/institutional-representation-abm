name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_shards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -ra --ci-shard ${{ matrix.shard }} --ci-shards 4 --junitxml=results/ci-tests.xml

      - name: Save test results (including local-artifact skips)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-${{ matrix.shard }}
          path: results/ci-tests.xml

      - name: Smoke-test multi-seed runner
        if: matrix.shard == 0
        run: |
          python -m experiments.multiseed_comparison \
            --scenarios baseline --seeds 5 --jobs 2 \
            --output results/ci_smoke --verbose 0

      - name: Smoke-test hung-parliament runner
        if: matrix.shard == 0
        run: |
          python -m experiments.hung_parliament \
            --scenarios fragmented --seeds 2 --jobs 2 --no-plots \
            --output results/ci_hung

  test:
    name: test (3.13)
    runs-on: ubuntu-latest
    needs: test_shards
    if: always()
    steps:
      - name: Require every test shard to pass
        env:
          SHARD_RESULT: ${{ needs.test_shards.result }}
        run: test "$SHARD_RESULT" = success
