name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -ra --junitxml=results/ci-tests.xml

      - name: Save test results (including local-artifact skips)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: results/ci-tests.xml

      - name: Smoke-test multi-seed runner
        run: |
          python -m experiments.multiseed_comparison \
            --scenarios baseline --seeds 5 --jobs 2 \
            --output results/ci_smoke --verbose 0

      - name: Smoke-test hung-parliament runner
        run: |
          python -m experiments.hung_parliament \
            --scenarios fragmented --seeds 2 --jobs 2 --no-plots \
            --output results/ci_hung
